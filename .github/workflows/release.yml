name: Release

# A version tag (v0.1.0) runs the full check, packages Embr and publishes a GitHub Release.
# Running it by hand (workflow_dispatch) does the same without publishing: the package is
# kept as a workflow artifact. Checks that need boards are run locally before tagging.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_version.py "$TAG"
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  package:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - name: Build and package
        run: uv run python scripts/package_release.py
      - name: Worker check on the build
        run: uv run python scripts/check_frozen_worker.py dist/Embr/Embr.exe
      - name: Check the package
        run: |
          name="embr_$(uv run python -c 'import embr; print(embr.__version__)')_windows_x64"
          uv run python scripts/verify_release.py "dist/release/$name.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          path: |
            dist/release/embr_*_windows_x64.zip
            dist/release/embr_*_windows_x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat CHANGELOG.md
            printf '\nSHA-256 of the package:\n\n```\n'
            cat release/*.sha256
            printf '```\n'
          } > notes.md
          gh release create "$TAG" release/*.zip release/*.sha256 \
            --title "Embr ${TAG#v}" --notes-file notes.md --verify-tag
