[project]
name = "embr"
version = "0.1.0"
description = "Firmware manager and flasher for Espressif chips"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "esptool==5.6.0",
    "pyside6-essentials==6.12.0",
    "tomli-w==1.2.0",
]

[project.scripts]
embr = "embr.main:main"

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"esptool.targets".msg = "Chip data goes through embr.core.chipinfo."
"serial.Serial".msg = "Only embr.core.flasher.worker opens serial ports."
"serial.serial_for_url".msg = "Only embr.core.flasher.worker opens serial ports."

[tool.ruff.lint.per-file-ignores]
"src/embr/core/chipinfo/**" = ["TID251"]
"src/embr/core/flasher/worker/**" = ["TID251"]
# tests compare against esptool directly and reopen ports on real boards
"tests/**" = ["TID251"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
# esptool ships inline annotations but no py.typed marker
reportMissingTypeStubs = false
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hardware: needs a connected board; set EMBR_TEST_PORT_UART / EMBR_TEST_PORT_USB / EMBR_TEST_PORT_P4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
