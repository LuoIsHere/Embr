[project]
name = "embr"
version = "0.1.0"
description = "Firmware manager and flasher for Espressif chips"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "esptool==5.6.0",
    "pyside6-essentials==6.12.0",
    "tomli-w==1.2.0",
]

[project.scripts]
embr = "embr.main:main"

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
